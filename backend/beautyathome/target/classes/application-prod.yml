# ============================================
# Perfil de PRODUCCIÓN — PostgreSQL
# ============================================
# Activar con: SPRING_PROFILES_ACTIVE=prod
# o con: java -jar app.jar --spring.profiles.active=prod
#
# Variables de entorno requeridas:
#   DB_HOST     — Host de PostgreSQL (default: localhost)
#   DB_PORT     — Puerto de PostgreSQL (default: 5432)
#   DB_NAME     — Nombre de la base de datos (default: beautyathome)
#   DB_USER     — Usuario de PostgreSQL (default: postgres)
#   DB_PASSWORD — Contraseña de PostgreSQL (default: postgres)
# ============================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:beautyathome}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
