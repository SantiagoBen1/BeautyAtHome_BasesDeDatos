# ============================================
# Perfil de DESARROLLO — H2 en memoria
# ============================================
# Activo por defecto. Usa una base de datos H2
# embebida para desarrollo rápido sin dependencias externas.
#
# Consola H2 disponible en: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:beautyathome_dev
# Usuario: sa  |  Contraseña: (vacía)
# ============================================

spring:
  datasource:
    url: jdbc:h2:mem:beautyathome_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
